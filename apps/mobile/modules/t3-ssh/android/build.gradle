apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

group = 'com.t3tools.t3ssh'
version = '0.0.0'

android {
  namespace 'expo.modules.t3ssh'
  compileSdk rootProject.ext.compileSdkVersion
  defaultConfig {
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  implementation project(':expo-modules-core')
  // Maintained JSch fork; Ed25519 runs through its Bouncy Castle classes (configured in
  // TunnelClient) because Android has no JCE EdEC and the jar's EdEC classes are multi-release.
  api 'com.github.mwiede:jsch:2.28.8'
  // Reuse the app's existing provider artifact to avoid duplicate org.bouncycastle classes.
  implementation 'org.bouncycastle:bcprov-jdk15to18:1.81'
  testImplementation 'junit:junit:4.13.2'
}
